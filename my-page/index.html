<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Page — AI Framework</title>
<meta name="description" content="Set up your AI Page: claim your handle, say what your AI does, and publish your frameworks for people to fork.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;700;800&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0D0A07;--panel:#1A130C;--line:#3A2A1A;--ivory:#EDE6D8;--dim:#AB9C88;--faint:#776A58;
  --copper:#2FA598;--copper2:#63C7B2;--brass:#C9A25E;--chrome:#C9CCD4}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ivory);font-family:Archivo,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
  .wrap{max-width:820px;margin:0 auto;padding:0 20px}
  header{padding:50px 0 26px;border-bottom:1px solid var(--line)}
  .kicker{font-family:"Spline Sans Mono",monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--copper)}
  h1{font-family:"Big Shoulders Display",sans-serif;font-size:40px;font-weight:800;margin:8px 0 8px}
  .sub{color:var(--dim);max-width:60ch}
  main{padding:28px 0 60px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px;margin-bottom:16px}
  .panel h2{font-family:"Big Shoulders Display",sans-serif;font-size:24px;margin-bottom:14px}
  label{display:block;font-family:"Spline Sans Mono",monospace;font-size:10.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--faint);margin:14px 0 6px}
  input[type=text],textarea{width:100%;background:#120D08;border:1px solid var(--line);border-radius:5px;
    color:var(--ivory);padding:11px 13px;font-size:15px;font-family:inherit}
  textarea{min-height:74px;resize:vertical}
  .hint{font-size:12.5px;color:var(--faint);margin-top:5px}
  .btn{font-family:"Spline Sans Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    background:linear-gradient(180deg,#E7BC55,#C2913B);color:#180F06;border:1px solid #8A6A24;border-radius:4px;
    padding:11px 18px;cursor:pointer;font-weight:700;margin-top:18px}
  .msg{font-size:14px;color:var(--copper2);margin-top:12px;min-height:20px}
  .state{border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--dim)}
  .state h2{font-family:"Big Shoulders Display",sans-serif;color:var(--ivory);font-size:26px;margin-bottom:6px}
  .state a{color:var(--copper2);font-weight:600}
  .fw{border-top:1px solid var(--line);padding:16px 0}
  .fw:first-of-type{border-top:none}
  .fw-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .fw-title{font-weight:600;font-size:16px}
  .fw-forks{font-family:"Spline Sans Mono",monospace;font-size:11px;color:var(--faint)}
  .toggle{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);cursor:pointer}
  .fw textarea{min-height:52px;margin-top:10px}
  .fw .save-note{margin-top:8px;padding:8px 13px;font-size:10.5px}
  .view-link{color:var(--brass);font-weight:600;text-decoration:none}
</style>
</head>
<body>
<header><div class="wrap">
  <p class="kicker">AI Pages</p>
  <h1>Your AI, on display.</h1>
  <p class="sub">Claim your handle, say what your AI does, and publish your best frameworks so people can fork them.</p>
</div></header>
<main><div class="wrap" id="host">
  <div class="state"><h2>Loading&hellip;</h2><p>Checking your account.</p></div>
</div></main>
<script>
(function(){
  var host = document.getElementById('host');
  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function state(h, t){ host.innerHTML = '<div class="state"><h2>' + h + '</h2><p>' + t + '</p></div>'; }
  function api(path, opts){
    return fetch(path, opts).then(function(r){
      return r.json().then(function(j){ return { status: r.status, ok: r.ok, j: j }; });
    });
  }

  api('/api/v1/me').then(function(me){
    if (!me.ok || !me.j.user) {
      state('Sign in first', 'AI Pages belong to members. <a href="/build-my-framework/">Sign in with your email</a>, then come back here.');
      return null;
    }
    return api('/api/v1/profile');
  }).then(function(res){
    if (!res) return;
    if (!res.ok) {
      if (res.j && res.j.code === 'not_ready') {
        state('AI Pages are almost here', 'The editor is built — publishing switches on with the launch. Your frameworks and account are untouched.');
      } else { state('Something went wrong', 'Your page could not load. Try again in a moment.'); }
      return;
    }
    render(res.j);
  }).catch(function(){ state('Something went wrong', 'Your page could not load. Try again in a moment.'); });

  function render(data){
    var p = data.profile || {};
    var fws = data.frameworks || [];
    var fwHtml = fws.length ? fws.map(function(f){
      return '<div class="fw" data-id="' + esc(f.id) + '">' +
        '<div class="fw-head"><span class="fw-title">' + esc(f.title) + '</span>' +
        '<span class="fw-forks">' + (f.forks || 0) + ' forks</span>' +
        '<label class="toggle"><input type="checkbox" class="pub-toggle" ' + (f.is_public ? 'checked' : '') + '> Public</label></div>' +
        '<textarea class="outcome" placeholder="Your result with this framework (optional) — e.g. Runs my client follow-ups, saves me ~5 hrs/week">' + esc(f.outcome_note || '') + '</textarea>' +
        '<button class="btn save-note" type="button">Save</button>' +
        '<p class="msg fw-msg"></p></div>';
    }).join('') : '<p style="color:var(--faint)">No saved frameworks yet. <a class="view-link" href="/build-my-framework/">Build one</a>, save it, then publish it here.</p>';

    host.innerHTML =
      '<div class="panel"><h2>Your page</h2>' +
      '<label for="fHandle">Handle</label>' +
      '<input type="text" id="fHandle" value="' + esc(p.handle || '') + '" placeholder="yourname" autocomplete="off">' +
      '<p class="hint">Your page lives at ai-framework.io/u/<span id="handleEcho">' + esc(p.handle || 'yourname') + '</span> — lowercase letters, numbers, _ only.</p>' +
      '<label for="fName">Display name</label>' +
      '<input type="text" id="fName" value="' + esc(p.display_name || '') + '" placeholder="Your name or brand">' +
      '<label for="fBio">Bio</label>' +
      '<textarea id="fBio" placeholder="One or two lines about you">' + esc(p.bio || '') + '</textarea>' +
      '<label for="fAi">What my AI does</label>' +
      '<textarea id="fAi" placeholder="e.g. My AI runs a faceless cooking channel: scripts, voiceovers, thumbnails, and posting — I just review.">' + esc(p.ai_about || '') + '</textarea>' +
      '<button class="btn" id="saveProfile" type="button">Save my page</button>' +
      (p.handle ? ' <a class="view-link" href="/u/' + esc(p.handle) + '">View my page &rarr;</a>' : '') +
      '<p class="msg" id="profileMsg"></p></div>' +
      '<div class="panel"><h2>Publish frameworks</h2>' +
      '<p style="color:var(--dim);font-size:14.5px">Flip a framework public and it appears on your page and in <a class="view-link" href="/ai-pages/">Discover</a>. People can fork the system — never your private data.</p>' +
      fwHtml + '</div>';

    var handleInput = document.getElementById('fHandle');
    handleInput.addEventListener('input', function(){
      document.getElementById('handleEcho').textContent = handleInput.value.trim().toLowerCase() || 'yourname';
    });
    document.getElementById('saveProfile').addEventListener('click', function(){
      var msg = document.getElementById('profileMsg');
      msg.textContent = 'Saving...';
      api('/api/v1/profile', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          handle: handleInput.value,
          display_name: document.getElementById('fName').value,
          bio: document.getElementById('fBio').value,
          ai_about: document.getElementById('fAi').value
        })
      }).then(function(r){
        msg.textContent = r.ok ? 'Saved. Your page: ai-framework.io/u/' + (r.j.handle || '') : (r.j.error || 'Could not save.');
      }).catch(function(){ msg.textContent = 'Could not save.'; });
    });

    host.querySelectorAll('.fw').forEach(function(row){
      var id = row.getAttribute('data-id');
      var msg = row.querySelector('.fw-msg');
      function save(){
        msg.textContent = 'Saving...';
        api('/api/v1/frameworks/' + id, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            is_public: row.querySelector('.pub-toggle').checked,
            outcome_note: row.querySelector('.outcome').value
          })
        }).then(function(r){
          msg.textContent = r.ok ? 'Saved.' : (r.j.error || 'Could not save.');
        }).catch(function(){ msg.textContent = 'Could not save.'; });
      }
      row.querySelector('.save-note').addEventListener('click', save);
      row.querySelector('.pub-toggle').addEventListener('change', save);
    });
  }
})();
</script>
</body>
</html>
