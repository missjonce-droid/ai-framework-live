<script>
(function(){
function clean(el){
return (el&&el.textContent||"").replace(/\s+/g," ").trim().toLowerCase();
}

function findDiscovery(){
var nodes=Array.from(document.querySelectorAll("section,div"));
var matches=nodes.filter(function(el){
var t=clean(el);
return t.includes("trending") &&
t.includes("discover") &&
t.includes("recently added") &&
t.includes("categories");
});
matches.sort(function(a,b){
return a.querySelectorAll("*").length-b.querySelectorAll("*").length;
});
return matches[0]||null;
}

function place(){
var discovery=findDiscovery();
var footer=document.querySelector("footer.legend");
if(!discovery||!footer||!footer.parentNode)return;

if(discovery.nextElementSibling!==footer){
footer.parentNode.insertBefore(discovery,footer);
}
}

if(document.readyState==="loading"){
document.addEventListener("DOMContentLoaded",place);
}else{
place();
}

var count=0;
var timer=setInterval(function(){
place();
count++;
if(count>40)clearInterval(timer);
},250);

var observer=new MutationObserver(place);
observer.observe(document.documentElement,{childList:true,subtree:true});
setTimeout(function(){observer.disconnect();},12000);
})();
</script>
