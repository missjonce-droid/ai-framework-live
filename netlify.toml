# AI Framework is a prebuilt static site: index.html and the hashed assets
# under static/ are committed, so there is no build step to run. Pinning the
# publish directory here stops the root - the folder that actually holds
# index.html - from being guessed.
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  # The handlers in netlify/functions/ import the shared implementations from
  # functions/api/*.js, so the bundler has to follow those imports.
  node_bundler = "esbuild"
